name: ИИ Сейчас — автопостинг

# Запуск каждые 30 минут (UTC 4-19 ≈ МСК 7-22). Скрипт сам постит РОВНО ОДИН раз
# за каждое окно суток (утро/день/вечер) — надёжнее точного времени на бесплатном GitHub.
# Ручной запуск (Run workflow) принудительно публикует пост сразу, минуя окна (FORCE=1).
on:
  schedule:
    - cron: '*/30 4-19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ai-seychas-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run autoposter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
          TIMEZONE_OFFSET: ${{ vars.TIMEZONE_OFFSET || '3' }}
          IMAGES_ENABLED: ${{ vars.IMAGES_ENABLED || '1' }}
          DRY_RUN: ${{ vars.DRY_RUN || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python news_bot.py

      - name: Save state (posted.json)
        if: always()
        run: |
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add posted.json
            git commit -m "update posted state"
            git push
          else
            echo "no changes in posted.json"
          fi
